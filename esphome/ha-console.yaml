# =============================================================================
# ESP32 HA Console - base template
#
# Turns a Waveshare ESP32-P4-WIFI6-Touch-LCD-7B into an interactive dashboard /
# console for Home Assistant. Everything talks to Home Assistant through the
# single ESPHome (native API) integration - no MQTT, no extra add-ons.
#
# Adjust the substitutions below to match your device and your Home Assistant
# entities, then Save -> Validate -> Install in ESPHome Device Builder.
# Copy only this file into the dashboard configuration folder.
# Hardware, Home Assistant entities and UI are downloaded from GitHub.
# Add the secrets from secrets.yaml.example using the dashboard Secrets editor.
# First flash: P4 USB serial port; later updates: Install -> Wirelessly.
# Full instructions: README.md in this folder.
# =============================================================================

substitutions:
  # --- Device -----------------------------------------------------------------
  name: ha-console
  friendly_name: HA Console
  timezone: Europe/London

  # Package path inside the GitHub repository (not a local file path).
  hardware_package: esphome/packages/hardware/waveshare-esp32-p4-wifi6-touch-lcd-7b.yaml

  # Seconds without a touch before the backlight is switched off (0 = never)
  idle_timeout: "0"

  # --- Home Assistant entities shown on the "Home" page -----------------------
  # In display order. Add or remove pairs as needed. Swipe up for the next 15.
  home_tiles:
    - { entity: light.fan_lamp_2, label: Bedroom Light }
    - { entity: light.kitchen, label: Kitchen }
    - { entity: switch.coffee_machine, label: Coffee }
    - { entity: light.bedroom, label: Bedroom }

  # --- Home Assistant sensors shown on the "Sensors" page ---------------------
  temperature_entity: sensor.skink_internal_temperature
  humidity_entity: sensor.living_room_humidity
  outdoor_temperature_entity: sensor.outdoor_temperature

  # --- Optional message shown in the status bar (e.g. an input_text) ----------
  message_entity: input_text.ha_console_message
  # Show the firmware build timestamp instead of the Home Assistant message.
  show_build_timestamp: false

# ESPHome downloads these packages when validating/building the configuration.
# Replace ref with a release tag or commit SHA to pin a known version.
packages:
  console:
    url: https://github.com/I-am-shadowspawn/fantastic-system
    ref: development
    refresh: 1min
    files:
      - ${hardware_package}
      - esphome/packages/homeassistant.yaml
      - esphome/packages/ui.yaml

# Keep connectivity and secrets local: remote packages cannot resolve !secret.
# This replaces the local packages/base.yaml include.
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: i-am-shadowspawn.ha-console
    version: "0.1.0"

logger:
  level: debug
  # hardware_uart: UART0

# The single Home Assistant integration (ESPHome native API).
# In Home Assistant, enable "Allow the device to perform Home Assistant
# actions" in the device's integration options so the console buttons work.
api:
  encryption:
    key: !secret api_encryption_key

# OTA updates are encrypted with the same Noise key as the API
ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback
    password: !secret fallback_ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    id: wifi_rssi
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic

button:
  - platform: restart
    name: Restart
    entity_category: config
