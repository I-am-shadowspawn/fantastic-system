# =============================================================================
# ESP32 HA Console - base template
#
# Turns a Waveshare ESP32-P4-WIFI6-Touch-LCD-7B into an interactive dashboard /
# console for Home Assistant. Everything talks to Home Assistant through the
# single ESPHome (native API) integration - no MQTT, no extra add-ons.
#
# Adjust the substitutions below to match your device and your Home Assistant
# entities, then Save -> Validate -> Install in ESPHome Device Builder.
# Copy this file AND packages/ into the dashboard configuration folder.
# Add the secrets from secrets.yaml.example using the dashboard Secrets editor.
# First flash: P4 USB serial port; later updates: Install -> Wirelessly.
# Full instructions: README.md in this folder.
# =============================================================================

substitutions:
  # --- Device -----------------------------------------------------------------
  name: ha-console
  friendly_name: HA Console
  timezone: Europe/London

  # Path relative to this file; keep the packages/ folder beside it.
  hardware_package: packages/hardware/waveshare-esp32-p4-wifi6-touch-lcd-7b.yaml

  # Seconds without a touch before the backlight is switched off (0 = never)
  idle_timeout: "60"

  # --- Home Assistant entities shown on the "Home" page -----------------------
  tile_1_entity: light.fan_lamp_2
  tile_1_label: Bedroom Light
  tile_2_entity: light.kitchen
  tile_2_label: Kitchen
  tile_3_entity: switch.coffee_machine
  tile_3_label: Coffee
  tile_4_entity: light.bedroom
  tile_4_label: Bedroom

  # --- Home Assistant sensors shown on the "Sensors" page ---------------------
  temperature_entity: camera.hot_skink_cam_hd_stream
  humidity_entity: sensor.living_room_humidity
  outdoor_temperature_entity: sensor.outdoor_temperature

  # --- Optional message shown in the status bar (e.g. an input_text) ----------
  message_entity: input_text.ha_console_message

packages:
  base: !include packages/base.yaml
  hardware: !include ${hardware_package}
  homeassistant: !include packages/homeassistant.yaml
  ui: !include packages/ui.yaml
