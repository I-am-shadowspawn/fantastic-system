# Hardware package: Waveshare ESP32-S3-Touch-LCD-4.3 (800x480, GT911 touch)
# https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-4.3
#
# To support another Waveshare board, copy this file, adjust the pins/model and
# point the "hardware" package in ha-console.yaml at the new file. The UI
# package only relies on the ids: main_display, main_touch and backlight.

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: false

# IO expander driving LCD reset, touch reset and backlight enable
ch422g:
  - id: ch422g_hub
    i2c_id: bus_a

display:
  - platform: mipi_rgb
    id: main_display
    model: ESP32-S3-TOUCH-LCD-4.3
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: main_touch
    display: main_display
    i2c_id: bus_a
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: ch422g_hub
      number: 1

# Backlight (on/off only on this board - CH422G EXIO2). Exposed to Home
# Assistant so automations can wake or blank the screen.
switch:
  - platform: gpio
    id: backlight
    name: Backlight
    icon: mdi:monitor
    restore_mode: ALWAYS_ON
    pin:
      ch422g: ch422g_hub
      number: 2
