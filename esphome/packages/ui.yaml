# LVGL user interface: status bar, navigation bar and three pages
#   Home    - toggle tiles bound to Home Assistant lights/switches
#   Sensors - live values imported from Home Assistant
#   Console - buttons that fire the "Console Button" event in Home Assistant
#
# Widgets use a flexible layout for the 1024x600 panel.

# Build one grid per fifteen entries after LVGL is set up and before networking.
# The fallback also accepts existing device YAMLs with the four numbered pairs.
json:

esphome:
  on_boot:
    priority: 300
    then:
      - lambda: |-
          if constexpr (${ 'true' if show_build_timestamp | default(false) | lower == 'true' else 'false' }) {
            char timestamp[Application::BUILD_TIME_STR_SIZE];
            App.get_build_time_string(timestamp);
            lv_label_set_text_fmt(id(status_message), "Build: %s", timestamp);
          }

          const char *mapping = ${ (home_tiles if home_tiles is defined else [
              dict(entity=tile_1_entity, label=tile_1_label),
              dict(entity=tile_2_entity, label=tile_2_label),
              dict(entity=tile_3_entity, label=tile_3_label),
              dict(entity=tile_4_entity, label=tile_4_label)
            ] if tile_1_entity is defined else []) | tojson | tojson };

          JsonDocument config;
          if (deserializeJson(config, mapping) || !config.is<JsonArray>()) {
            ESP_LOGE("home_tiles", "Expected a list of entity/label pairs");
            return;
          }
          auto tiles = config.as<JsonArrayConst>();
          for (JsonVariantConst tile : tiles) {
            const char *entity = tile["entity"].as<const char *>();
            if (entity == nullptr || *entity == '\0' || !tile["label"].is<const char *>()) {
              ESP_LOGE("home_tiles", "Every tile needs an entity ID and a label");
              return;
            }
          }

          constexpr size_t columns = 5;
          constexpr size_t rows = 3;

          constexpr size_t tiles_per_page = columns * rows;
          static int32_t column_tracks[columns + 1];
          static int32_t row_tracks[rows + 1];
          for (size_t column = 0; column < columns; ++column) {
            column_tracks[column] = LV_GRID_FR(1);
          }
          for (size_t row = 0; row < rows; ++row) {
            row_tracks[row] = LV_GRID_FR(1);
          }
          column_tracks[columns] = LV_GRID_TEMPLATE_LAST;
          row_tracks[rows] = LV_GRID_TEMPLATE_LAST;
          lv_obj_t *pages = id(home_pages);
          lv_obj_t *grid = id(home_first_grid);
          size_t index = 0;
          for (JsonVariantConst tile : tiles) {
            const size_t cell = index % tiles_per_page;
            if (cell == 0) {
              if (index != 0) {
                const auto direction = index + tiles_per_page < tiles.size()
                    ? LV_DIR_VER : LV_DIR_TOP;
                grid = lv_tileview_add_tile(pages, 0, index / tiles_per_page, direction);
              }
              lv_obj_remove_flag(grid, LV_OBJ_FLAG_SCROLLABLE);
              lv_obj_set_style_pad_all(grid, 0, LV_PART_MAIN);
              lv_obj_set_style_pad_row(grid, 12, LV_PART_MAIN);
              lv_obj_set_style_pad_column(grid, 12, LV_PART_MAIN);
              lv_obj_set_grid_dsc_array(grid, column_tracks, row_tracks);
            }

            const std::string entity = tile["entity"].as<const char *>();
            auto *button = lv_button_create(grid);
            lv_obj_remove_flag(button, LV_OBJ_FLAG_SCROLLABLE);
            lv_obj_set_grid_cell(button, LV_GRID_ALIGN_STRETCH, cell % columns, 1,
                                LV_GRID_ALIGN_STRETCH, cell / columns, 1);
            lv_obj_set_style_bg_color(button, lv_color_hex(0x22282E), LV_PART_MAIN);
            lv_obj_set_style_bg_color(button, lv_color_hex(0xF5A623), LV_STATE_CHECKED);
            lv_obj_set_style_bg_opa(button, LV_OPA_COVER, LV_PART_MAIN);
            lv_obj_set_style_text_color(button, lv_color_hex(0xE0E0E0), LV_PART_MAIN);
            lv_obj_set_style_text_color(button, lv_color_hex(0x101418), LV_STATE_CHECKED);
            lv_obj_set_style_radius(button, 16, LV_PART_MAIN);
            lv_obj_set_style_border_width(button, 0, LV_PART_MAIN);
            lv_obj_set_style_shadow_width(button, 0, LV_PART_MAIN);

            auto *label = lv_label_create(button);
            lv_obj_set_width(label, lv_pct(92));
            lv_obj_set_style_text_align(label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN);
            lv_label_set_long_mode(label, LV_LABEL_LONG_DOT);
            const char *icon = entity.compare(0, 7, "switch.") == 0 ? "\uF011" : "\uF0EB";
            lv_label_set_text_fmt(label, "%s  %s", icon, tile["label"].as<const char *>());
            lv_obj_center(label);

            // LVGL keeps the callback context for the lifetime of the button.
            auto *target = new std::string(entity);
            lv_obj_add_event_cb(button, [](lv_event_t *event) {
              const auto *entity_id = static_cast<const std::string *>(lv_event_get_user_data(event));
              id(toggle_home_entity).execute(*entity_id);
            }, LV_EVENT_SHORT_CLICKED, target);
            lv_obj_add_event_cb(button, [](lv_event_t *event) {
              delete static_cast<std::string *>(lv_event_get_user_data(event));
            }, LV_EVENT_DELETE, target);

            api::global_api_server->subscribe_home_assistant_state(
                entity, {}, [button](StringRef state) {
                  if (state == "on") {
                    lv_obj_add_state(button, LV_STATE_CHECKED);
                  } else {
                    lv_obj_remove_state(button, LV_STATE_CHECKED);
                  }
                });
            ++index;
          }

          if (tiles.size() <= tiles_per_page) {
            lv_obj_set_scroll_dir(pages, LV_DIR_NONE);
          }

script:
  - id: toggle_home_entity
    parameters:
      entity_id: string
    then:
      - homeassistant.action:
          action: homeassistant.toggle
          data:
            entity_id: !lambda return entity_id;

lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touch
  buffer_size: 25%
  bg_color: 0x101418
  text_color: 0xE0E0E0
  text_font: montserrat_20

  style_definitions:
    - id: card_style
      bg_color: 0x22282E
      bg_opa: COVER
      radius: 16
      border_width: 0
      pad_all: 12
    - id: nav_button_style
      bg_opa: TRANSP
      border_width: 0
      shadow_width: 0
      text_font: montserrat_28

  theme:
    button:
      bg_color: 0x22282E
      bg_opa: COVER
      radius: 16
      border_width: 0
      shadow_width: 0
      text_color: 0xE0E0E0
      checked:
        bg_color: 0xF5A623
        text_color: 0x101418

  # Blank the screen after the configured idle time (see "Screen Timeout")
  on_idle:
    timeout: !lambda return (uint32_t) (id(screen_timeout).state * 1000);
    then:
      - if:
          condition:
            lambda: return id(screen_timeout).state > 0;
          then:
            - logger.log: "Screen idle - blanking"
            - switch.turn_off: backlight
            - lvgl.pause:

  top_layer:
    widgets:
      # --- Status bar --------------------------------------------------------
      - obj:
          id: status_bar
          align: TOP_MID
          width: 100%
          height: 50
          radius: 0
          bg_color: 0x1A1F24
          # The top layer does not inherit the active screen's text colour.
          text_color: 0xFFFFFF
          border_width: 0
          pad_all: 0
          scrollable: false
          widgets:
            - label:
                id: status_time
                align: LEFT_MID
                x: 16
                text: "--:--"
                text_font: montserrat_28
            - label:
                id: status_message
                align: CENTER
                width: 500
                long_mode: DOT
                text_align: CENTER
                text: ""
            - label:
                id: status_connection
                align: RIGHT_MID
                x: -16
                text: "\uF1EB"
                text_color: 0xFFFFFF

      # --- Navigation bar ----------------------------------------------------
      - obj:
          id: nav_bar
          align: BOTTOM_MID
          width: 100%
          height: 70
          radius: 0
          bg_color: 0x1A1F24
          border_width: 0
          pad_all: 0
          scrollable: false
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: SPACE_EVENLY
            flex_align_cross: CENTER
          widgets:
            - button:
                styles: nav_button_style
                width: 200
                height: 60
                widgets:
                  - label:
                      align: CENTER
                      text: "\uF015"
                on_click:
                  - lvgl.page.show: home_page
            - button:
                styles: nav_button_style
                width: 200
                height: 60
                widgets:
                  - label:
                      align: CENTER
                      text: "\uF00B"
                on_click:
                  - lvgl.page.show: sensors_page
            - button:
                styles: nav_button_style
                width: 200
                height: 60
                widgets:
                  - label:
                      align: CENTER
                      text: "\uF013"
                on_click:
                  - lvgl.page.show: console_page

  pages:
    # --- Home: swipe between 5-column, 3-row grids of toggle tiles -----------
    - id: home_page
      pad_top: 62
      pad_bottom: 82
      pad_left: 12
      pad_right: 12
      scrollable: false
      widgets:
        - tileview:
            id: home_pages
            width: 100%
            height: 100%
            pad_all: 0
            border_width: 0
            bg_opa: TRANSP
            scrollbar_mode: AUTO
            tiles:
              - id: home_first_grid
                row: 0
                column: 0
                dir: BOTTOM

    # --- Sensors: values from Home Assistant -------------------------------
    - id: sensors_page
      pad_top: 62
      pad_bottom: 82
      pad_left: 12
      pad_right: 12
      scrollable: false
      layout:
        type: GRID
        pad_column: 12
        grid_rows: [FR(1)]
        grid_columns: [FR(1), FR(1), FR(1)]
      widgets:
        - obj:
            styles: card_style
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label:
                  align: TOP_MID
                  text: "Indoor"
              - label:
                  id: temperature_value
                  align: CENTER
                  text_font: montserrat_48
                  text: "--"
        - obj:
            styles: card_style
            grid_cell_row_pos: 0
            grid_cell_column_pos: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label:
                  align: TOP_MID
                  text: "Humidity"
              - label:
                  id: humidity_value
                  align: CENTER
                  text_font: montserrat_48
                  text: "--"
        - obj:
            styles: card_style
            grid_cell_row_pos: 0
            grid_cell_column_pos: 2
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label:
                  align: TOP_MID
                  text: "Outdoor"
              - label:
                  id: outdoor_temperature_value
                  align: CENTER
                  text_font: montserrat_48
                  text: "--"

    # --- Console: buttons that fire events in Home Assistant ---------------
    - id: console_page
      pad_top: 62
      pad_bottom: 82
      pad_left: 12
      pad_right: 12
      scrollable: false
      layout:
        type: GRID
        pad_row: 12
        pad_column: 12
        grid_rows: [FR(1), FR(1)]
        grid_columns: [FR(1), FR(1), FR(1)]
      widgets:
        - button:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label:
                  align: CENTER
                  text: "Scene 1"
            on_click:
              - event.trigger:
                  id: console_event
                  event_type: scene_1
        - button:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label:
                  align: CENTER
                  text: "Scene 2"
            on_click:
              - event.trigger:
                  id: console_event
                  event_type: scene_2
        - button:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 2
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label:
                  align: CENTER
                  text: "Scene 3"
            on_click:
              - event.trigger:
                  id: console_event
                  event_type: scene_3
        - button:
            grid_cell_row_pos: 1
            grid_cell_column_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label:
                  align: CENTER
                  text: "Scene 4"
            on_click:
              - event.trigger:
                  id: console_event
                  event_type: scene_4
        - button:
            grid_cell_row_pos: 1
            grid_cell_column_pos: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label:
                  align: CENTER
                  text: "Scene 5"
            on_click:
              - event.trigger:
                  id: console_event
                  event_type: scene_5
        - button:
            grid_cell_row_pos: 1
            grid_cell_column_pos: 2
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label:
                  align: CENTER
                  text: "Scene 6"
            on_click:
              - event.trigger:
                  id: console_event
                  event_type: scene_6

# Wake the screen on touch
touchscreen:
  - id: !extend main_touch
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "Touch - waking screen"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - switch.turn_on: backlight

# Keep the status bar clock and connection indicator up to date
interval:
  - interval: 5s
    then:
      - lvgl.label.update:
          id: status_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
      - if:
          condition: api.connected
          then:
            - lvgl.label.update:
                id: status_connection
                text_color: 0x7ED321
          else:
            - lvgl.label.update:
                id: status_connection
                text_color: 0xD0021B
