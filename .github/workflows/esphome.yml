name: ESPHome

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Create CI secrets
        working-directory: esphome
        run: |
          sed "s|^api_encryption_key:.*|api_encryption_key: \"$(openssl rand -base64 32)\"|" \
            secrets.yaml.example > secrets.yaml

      - name: Validate configuration
        working-directory: esphome
        run: esphome config ha-console.yaml

      - name: Compile firmware
        working-directory: esphome
        run: esphome compile ha-console.yaml
