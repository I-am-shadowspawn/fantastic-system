name: ESPHome

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hardware: [p4, s3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome==2026.11.0

      - name: Test Wiser discovery and commands
        run: python -m unittest discover -s tests -v

      - name: Create CI secrets
        working-directory: esphome
        run: |
          sed "s|^api_encryption_key:.*|api_encryption_key: \"$(openssl rand -base64 32)\"|" \
            secrets.yaml.example > secrets.yaml

      - name: Select checked-out packages
        run: python tools/local_config.py --hardware ${{ matrix.hardware }}

      - name: Validate configuration
        run: esphome config esphome/.ci-${{ matrix.hardware }}.yaml

      - name: Compile firmware
        run: esphome compile esphome/.ci-${{ matrix.hardware }}.yaml
